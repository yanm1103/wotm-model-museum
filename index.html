<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WotM Model Museum</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="backdrop"></div>
    <canvas id="scene"></canvas>

    <!-- shown where the monster goes while its .glb (or, on first visit, the page's own script) is still downloading -->
    <div id="loader" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loader-text">Loading…</p>
    </div>

    <div id="drawer">
      <aside id="panel">
        <img id="logo" alt="" hidden />
        <label>
          Monster
          <select id="monster"></select>
        </label>
        <fieldset id="stages">
          <legend>Background</legend>
          <div id="stage-grid"></div>
          <label id="color-row" class="color-row" hidden>
            <span>Color</span>
            <input type="color" id="bg-color" value="#2b2f3a" />
          </label>
        </fieldset>
        <fieldset id="layers">
          <legend>Show</legend>
          <div class="checks">
            <label class="check"><input type="checkbox" id="show-mesh" checked /> Mesh</label>
            <label class="check"><input type="checkbox" id="show-wire" /> Wireframe</label>
            <label class="check"><input type="checkbox" id="show-bones" /> Bones</label>
          </div>
        </fieldset>
        <label>
          Lighting
          <select id="light">
            <option value="game">Game</option>
            <option value="unlit">Unlit (texture only)</option>
            <option value="side">Side</option>
            <option value="top">Top</option>
            <option value="back">Backlight</option>
            <option value="custom" hidden>Custom</option>
          </select>
        </label>
        <details id="light-tweaks">
          <summary>Adjust lighting</summary>
          <label class="slider">
            <span>Ambient <output id="v-amb"></output></span>
            <input type="range" id="amb" min="0" max="1.5" step="0.05" />
          </label>
          <label class="slider">
            <span>Directional <output id="v-dir"></output></span>
            <input type="range" id="dir" min="0" max="2" step="0.05" />
          </label>
          <label class="slider">
            <span>Direction <output id="v-az"></output></span>
            <input type="range" id="az" min="-180" max="180" step="1" />
          </label>
          <label class="slider">
            <span>Height <output id="v-el"></output></span>
            <input type="range" id="el" min="-60" max="90" step="1" />
          </label>
        </details>
        <div id="model-info">
          <a id="download" class="button" href="#" download hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span id="download-label">Download .glb</span>
          </a>
          <button id="snapshot" class="button" type="button" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              <circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Save as png</span>
          </button>
          <button id="snapshot-alpha" class="button" type="button" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M4 4h4v4H4zM12 4h4v4h-4zM8 8h4v4H8zM16 8h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4zM8 16h4v4H8zM16 16h4v4h-4z"
                fill="currentColor" opacity="0.7" />
            </svg>
            <span>Save as png (no bg)</span>
          </button>
          <p id="stats"></p>
        </div>
        <p id="status" role="status"></p>
      </aside>
      <button id="drawer-toggle" type="button" aria-controls="panel" aria-expanded="true" aria-label="Hide controls">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <footer>Fan project by TwistZero. War of the Monsters © Sony Interactive Entertainment; not affiliated with Sony.</footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
